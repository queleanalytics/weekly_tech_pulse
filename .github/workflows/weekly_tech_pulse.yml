name: Weekly Tech Pulse Automation

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual execution from the GitHub UI

jobs:
  run-tech-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up and configure R environment
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install required Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            tidyverse
            httr
            rvest
            ellmer
            openxlsx

      - name: Execute web scraping and Claude AI analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          URL_WEBHOOK: ${{ secrets.URL_WEBHOOK }}
        run: Rscript weekly_tech_pulse.R

      - name: Commit and push generated reports back to GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add Tech_Pulse_*.md tech_pulse_history.xlsx
          git commit -m "🤖 Routine: Update weekly tech pulse report and Excel history" || echo "No changes to commit"
          git push

